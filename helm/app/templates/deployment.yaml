apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      containers:
      - name: demo-java-app
        image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: DB_HOST
          valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: DB_HOST}}
        - name: DB_PORT
          valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: DB_PORT}}
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: DB_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: DB_PASSWORD}}
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
