apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devops-lab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Local development GitOps laboratory
  sourceRepos:
    - {{ required "repoUrl is required" .Values.repoUrl | quote }}
  destinations:
    - namespace: demo-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
