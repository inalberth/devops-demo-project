replicaCount: 1

image:
  repository: nginx
  tag: 1.29.1-alpine
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: true
  className: traefik
  host: payroll.localhost

secret:
  name: payroll-database

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
